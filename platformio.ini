[platformio]
default_envs = frontdoor
boards_dir = boards

[env]
platform = espressif32 @ 6.13.0
board = waveshare_esp32s3_eth
framework = arduino
monitor_speed = 115200
upload_speed = 460800
lib_deps =
  pololu/Tic @ 2.2.0
  greiman/SSD1306Ascii @ 1.3.5
  bblanchon/ArduinoJson @ 7.4.3
build_flags = -Wall -Wextra

[env:frontdoor]
build_flags = ${env.build_flags} -DFRONT_DOOR

[env:reardoor]
build_flags = ${env.build_flags} -DREAR_DOOR

[env:bench]
build_flags = ${env.build_flags} -DFRONT_DOOR -DMOTOR_INHIBITED
